name: Build and deploy PlaySound

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tracks.json'
      - 'featured.json'
      - 'album-art.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate music manifest
        run: python3 scripts/generate_tracks.py

      - name: Save generated manifest to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracks.json featured.json album-art.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged"
          else
            git commit -m "Update generated music manifest"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
